name: Playwright Tests

on:
  push:
    branches: [ main, validation_branch, new_branch ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Запуск вручную (on demand)

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Run fast @smoke tests on Pull Requests
    - name: Run Playwright Smoke Tests
      if: github.event_name == 'pull_request'
      run: npm run test:smoke

    # Run @regression tests on branch pushes
    - name: Run Playwright Regression Tests
      if: github.event_name == 'push'
      run: npm run test:regression

    # Run full test suite manually (on demand)
    - name: Run Full Playwright Test Suite
      if: github.event_name == 'workflow_dispatch'
      run: npm run test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30